[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taime-api"
version = "2.0.0"
description = "TAIME v2.0 - Trustworthy AI Models Engine API"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "THEMIS 5.0 Consortium" }
]

# Upper bounds pin the stack to the versions this project was built and tested
# against (mid-2025 era, anchored by darts==0.39.0 / pytorch-lightning==2.5.2).
# Without them, a fresh build pulls incompatible majors (transformers 5.x,
# numpy 2.4, pandas 3.0, torch 2.13) that break training. Keep in sync if you
# intentionally upgrade a framework.
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlmodel>=0.0.14,<0.0.25",  # newer releases reject the naive UTC datetimes the models store
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0,<3",
    "pydantic-settings>=2.1.0,<3",
    "numpy>=1.26,<2.2",
    "pandas>=2.1.0,<2.3",
    "aiofiles>=23.2.0",
    "darts==0.39.0",
    "pyarrow==16.1.0",
    "pytorch-lightning==2.5.2",
    "torch>=2.4,<2.8",
    "torchmetrics==1.6.2",
    "xgboost>=2.0.0,<3",
    "transformers>=4.36.0,<5",
    "accelerate>=0.26.0,<2",
    "scikit-learn>=1.3.0,<1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
ml = [
    "shap>=0.44.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taime_api"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["taime_api"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
